<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatterbox - Signup</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            <div class="logo-icon">C</div>
            <h1>AI Chatterbox</h1>
        </div>

        <p class="subtitle">
            Create your account
        </p>

        <form id="signupForm">

            <div class="input-group">
                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >
            </div>

            <button
                type="submit"
                class="primary-btn"
                id="signupBtn"
            >
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="switch-page">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
